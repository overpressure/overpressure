<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>PICO 4 from the front: a wide shell round a dark glass front, its head ring and its top strap</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2e35"/><stop offset="1" stop-color="#0f1013"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="188" x2="0" y2="338" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a92ff"/><stop offset="0.5" stop-color="#2a66ec"/><stop offset="1" stop-color="#1a43b8"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="188" x2="0" y2="270" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="204" x2="0" y2="322" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c2230"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- Behind the shell: the rigid head ring, and the wide top strap from the shell's top to the ring's back. -->
  <path d="M104 266 A152 124 0 0 1 408 266" fill="none" stroke="#163a9e" stroke-width="30" stroke-linecap="round"/>
  <rect x="226" y="134" width="60" height="80" rx="12" fill="#163a9e"/>
  <!-- The shell: wide, its lower edge rising over the nose. -->
  <path d="M160 188 H352 A64 64 0 0 1 416 252 V274 A64 64 0 0 1 352 338 H318 C294 338 286 320 256 320 C226 320 218 338 194 338 H160 A64 64 0 0 1 96 274 V252 A64 64 0 0 1 160 188 Z" fill="url(#blue)"/>
  <path d="M160 188 H352 A64 64 0 0 1 416 252 V274 A64 64 0 0 1 352 338 H318 C294 338 286 320 256 320 C226 320 218 338 194 338 H160 A64 64 0 0 1 96 274 V252 A64 64 0 0 1 160 188 Z" fill="url(#sheen)"/>
  <!-- The front: one dark glass panel, nearly the whole face, the colour camera at its middle. -->
  <path d="M166 204 H346 A52 52 0 0 1 398 256 V270 A52 52 0 0 1 346 322 H320 C298 322 288 304 256 304 C224 304 214 322 192 322 H166 A52 52 0 0 1 114 270 V256 A52 52 0 0 1 166 204 Z" fill="url(#glass)"/>
  <path d="M166 204 H346 A52 52 0 0 1 384 220 L196 304 C190 312 184 322 176 322 H166 A52 52 0 0 1 114 270 V256 A52 52 0 0 1 166 204 Z" fill="url(#glint)"/>
  <circle cx="256" cy="262" r="7" fill="#0b0d12" stroke="#3b4660" stroke-width="3"/>
  <!-- The vent along the top, and the tracking cameras on the shell's sides and below. -->
  <path d="M222 196 H290" stroke="#163a9e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="105" cy="248" r="6" fill="#0b0d12"/>
  <circle cx="407" cy="248" r="6" fill="#0b0d12"/>
  <circle cx="190" cy="330" r="5" fill="#0b0d12"/>
  <circle cx="322" cy="330" r="5" fill="#0b0d12"/>
</svg>
