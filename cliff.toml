# The changelog, from the conventional commits, by git-cliff (docs/releasing.md); scripts/release.py notes writes
# a release's notes and CHANGELOG.md with it, starting at the first release:
#   uvx git-cliff@2.14.2 --unreleased        what the next release brings
# Features and fixes for users, each commit's subject; everything else in one count. scripts/release.py names
# the contributors (commit.extra.author and .pr, the release's extra.contributors) when it has a token.

[changelog]
header = """
# Changelog

Generated from the conventional commits by git-cliff ([docs/releasing.md](docs/releasing.md)).
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
{%- if group | striptags | trim == "Other" %}
{{ commits | length }} other commits: documentation, tests, tooling and refactoring.
{% else %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} (breaking){% endif %}
{%- if commit.extra and commit.extra.author %} by @{{ commit.extra.author }}{% endif %}
{%- if commit.extra and commit.extra.pr %} in #{{ commit.extra.pr }}{% endif %}
{%- endfor %}
{% endif %}
{%- endfor %}
{%- if extra and extra.contributors %}
Contributors: {% for name in extra.contributors %}@{{ name }}{% if not loop.last %}, {% endif %}{% endfor %}
{% endif %}

"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
# The releases: the calendar versions (2026.11.0b0), and the v1.0-beta.N before them.
tag_pattern = '^(v[0-9]|20[0-9]{2}\.[0-9])'
sort_commits = "newest"
