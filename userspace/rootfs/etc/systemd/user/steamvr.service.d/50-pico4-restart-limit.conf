# Valve's unit restarts SteamVR always, and each start takes 15-20 s, so systemd's
# default start limit never applies. Every start resets the controller radio: a
# compositor that crashes on start buzzed the controllers every few seconds, without
# end (docs/session.md). Restarts wait 25 s, so the radio resets at most every 35 s or
# so; after three starts in five minutes systemd gives up, and the session falls back
# to Monado's (pico4-steamvr-failed.service, pico4-session-fallback.path). A single
# crash is still recovered. RestartMode=direct keeps the unit out of the failed state
# between restarts: otherwise OnFailure= runs at the first crash.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3
OnFailure=pico4-steamvr-failed.service

[Service]
RestartSec=25
RestartMode=direct
