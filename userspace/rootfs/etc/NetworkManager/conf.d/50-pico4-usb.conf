# The USB-C link to the PC is configured by systemd-networkd from the stage-1
# settings (/etc/systemd/network/50-pico4-usb.network, written by pico4-userspace
# switch). NetworkManager keeps managing everything else, as on SteamOS.
[keyfile]
unmanaged-devices=interface-name:usb*;interface-name:ncm*;interface-name:rndis*
