# The tracking cameras' nodes (Spectra CSL, docs/xr.md) belong to Monado or to
# SteamVR's driver_monado. PipeWire's camera monitors must not probe them: a
# probe of these nodes blocked the camera hub in step 5.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
