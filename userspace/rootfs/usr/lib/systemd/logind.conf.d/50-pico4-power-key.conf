# The power button as on PICO OS (docs/install.md): a short press must not end the session, it
# turns the screen off there (and suspends), and powering off takes a long press (PICO OS: a
# menu after 2 s). Without suspend and a display power-off the short press does nothing here;
# logind's long press (5 s) powers off. Held 8.7 s the PMIC resets the headset.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
