# SteamVR on the PICO 4 (docs/session.md). Its compositor finds the panels through
# the pico4-vrdisplay Vulkan layer (the KGSL GPU has no display of its own);
# driver_monado (Monado's SteamVR plugin) provides the headset and controllers;
# its recommended render size is the panel's (100%), not Monado's default 140%.
[Service]
Environment=XRT_COMPOSITOR_SCALE_PERCENTAGE=100
Environment=PICO4_VRDISPLAY=1
Environment=PICO4_VRDISPLAY_LOGFILE=%h/.local/share/Steam/logs/pico4-vrdisplay.txt
