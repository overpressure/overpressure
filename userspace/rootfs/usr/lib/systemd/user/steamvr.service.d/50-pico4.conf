# SteamVR on the PICO 4 (docs/session.md). Its compositor finds the panels through
# the pico4-vrdisplay Vulkan layer (the KGSL GPU has no display of its own);
# driver_monado (Monado's SteamVR plugin) provides the headset and controllers;
# its recommended render size is the panel's (100%), not Monado's default 140%.
# SteamVR starts its compositor about 4 ms before the vblank it sees; the layer signals
# vblanks 6 ms early so that a compositor frame of up to about 10 ms makes the vblank, and
# the driver predicts 6 ms further to match (docs/session.md, performance).
[Service]
Environment=XRT_COMPOSITOR_SCALE_PERCENTAGE=100
Environment=PICO4_VRDISPLAY=1
Environment=PICO4_VRDISPLAY_VSYNC_LEAD_US=6000
# Compressed (UBWC) scanout: the compositor renders into compressed images, which halves
# its lens-distortion pass and frees memory bandwidth (docs/session.md, performance).
Environment=PICO4_VRDISPLAY_UBWC=1
# The display layer raises the GPU floor while presenting; a crashed compositor cannot
# restore it, so every stop puts back KGSL's default (min_pwrlevel is writable by video).
ExecStopPost=-/bin/sh -c 'cat /sys/class/kgsl/kgsl-3d0/default_pwrlevel > /sys/class/kgsl/kgsl-3d0/min_pwrlevel'
Environment=PICO4_VRDISPLAY_LOGFILE=%h/.local/share/Steam/logs/pico4-vrdisplay.txt
