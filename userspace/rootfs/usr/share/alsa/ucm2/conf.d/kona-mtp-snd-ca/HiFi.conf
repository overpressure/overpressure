# Both directions on MultiMedia1 (PCM 0), as PICO OS plays and records media. The front end only
# accepts hardware parameters while its whole path to the speakers or the microphone is connected,
# so the verb sets both paths; there is nothing to switch between (one output, one input). DAPM
# powers the amplifiers only while a stream runs.
SectionVerb {
	EnableSequence [
		# "speaker"
		cset "name='WSA_CDC_DMA_RX_0 Channels' Two"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='WSA_COMP2 Switch' 1"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 1"
		cset "name='SpkrLeft SWR DAC_Port Switch' 1"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 1"
		cset "name='SpkrRight SWR DAC_Port Switch' 1"
		# "deep-buffer-playback"
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		# "handset-mic" (amic1, the WCD938x's ADC1)
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		# "audio-record"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	# PICO OS's defaults.
	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SpkrLeft SWR DAC_Port Switch' 0"
		cset "name='SpkrRight SWR DAC_Port Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
		cset "name='WSA_CDC_DMA_RX_0 Channels' One"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphone"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
}
