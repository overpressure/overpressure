# pacman configuration for the PICO 4 SteamOS-compatible userspace (roadmap step 4).
#
# The public Holo Core aarch64 preview resolves everything by default.
# packages.txt takes a few packages explicitly from Valve's Steam Frame
# ("deckard") hotfix repository: above all systemd 257.7, because the
# preview's systemd 258 requires Linux >= 5.4 and cannot run on the stock
# PICO 4.19 kernel. The Frame repository is not first: several of its
# libraries (ffmpeg, freerdp, ...) were built against the Frame's private base
# and need older library versions than the public preview provides.
# build-userspace.sh checks the Frame binaries' libraries with ldd.
#
# Neither Valve repository publishes package or database signatures. Integrity
# rests on HTTPS plus the hashes that build-userspace.sh records in its manifest.
# The installed system gets this file with "IgnorePkg = systemd ..." added.

[options]
Architecture = aarch64
HoldPkg = pacman glibc
ParallelDownloads = 4
# The root filesystem lives in compressed RAM on the headset: skip documentation.
NoExtract = usr/share/help/* usr/share/doc/* usr/share/gtk-doc/* usr/share/info/* usr/share/man/*
SigLevel = Optional TrustAll
LocalFileSigLevel = Optional

# Project-built packages (Turnip with the KGSL backend, graphics tests).
[pico4]
SigLevel = Optional TrustAll
Server = file:///var/cache/pico4-repo

[core]
Server = https://holo-packages.steamos.cloud/holo-core-aarch64-preview/mash-20251118.3/$repo/os/$arch

[extra]
Server = https://holo-packages.steamos.cloud/holo-core-aarch64-preview/mash-20251118.3/$repo/os/$arch

[deckard-arch-hotfixes-release-0.3]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard-hotfixes/release/0.3.x
