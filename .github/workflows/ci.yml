# Every push and pull request, and every release before it is made (release.yml): nothing here needs
# vendor files or a headset.
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Linux: the oldest and the newest Python an owner's system may bring, since install.sh prefers a
  # system Python whose Tk draws with Xft (uv's own Python on Linux has a Tk without it).
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m unittest
        env:
          PYTHONIOENCODING: utf-8

  # Windows and macOS: the Python the start scripts install there (Install.cmd, Install.command).
  host-tests-windows-macos:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest
        env:
          PYTHONIOENCODING: utf-8

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check

  shell-and-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shell tests
        run: |
          bash devices/phoenix/tests/test_recovery_policy.sh
          sh devices/phoenix/tests/test_charger.sh
          bash devices/phoenix/tests/test_boot_attempts.sh
      - name: Shellcheck
        run: python3 scripts/run-shellcheck.py
      - name: C tests
        run: bash scripts/c-tests.sh

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Links in the documents
        run: python3 scripts/check-docs.py
      - name: Private data, in every commit
        run: python3 scripts/check-private.py --history
      - name: The pinned kernel release, downloaded and checked against the pin
        run: python3 -m overpressure --device phoenix kernel fetch
      - name: What the pinned kernel and this repository share (contracts)
        run: python3 -m overpressure --device phoenix kernel contracts
