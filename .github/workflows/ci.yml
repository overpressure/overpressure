# Every push and pull request: nothing here needs vendor files or a headset.
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest
        env:
          PYTHONIOENCODING: utf-8

  shell-and-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools
        run: sudo apt-get install -y --no-install-recommends shellcheck libeigen3-dev
      - name: Shell tests
        run: |
          bash devices/phoenix/tests/test_recovery_policy.sh
          sh devices/phoenix/tests/test_charger.sh
      - name: Shellcheck
        run: python3 scripts/run-shellcheck.py
      - name: C and C++ tests
        run: bash scripts/c-tests.sh

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Links in the documents
        run: python3 scripts/check-docs.py
      - name: Private data, in every commit
        run: python3 scripts/check-private.py --history
