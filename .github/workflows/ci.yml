# Every pull request, every push to main, and every release before it is made (release.yml): nothing here
# needs vendor files or a headset. One run per content: a tree that passed once (a pull request's) is not
# tested again when it lands on main or is tagged; its checks are skipped, which counts as passed.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Whether this tree passed in an earlier run of this repository (never a fork's): the artifact its last
  # job leaves.
  tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.earlier.outputs.id != '' }}
      marker: ${{ steps.tree.outputs.marker }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The tree
        id: tree
        run: echo "marker=ci-passed-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: An earlier pass
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.tree.outputs.marker }}
          OURS: "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == ${{ github.repository_id }})][0].id // empty"
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$MARKER&per_page=30" --jq "$OURS")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          [ -z "$id" ] || echo "$MARKER passed before (artifact $id): the checks are skipped"

  # Linux: the oldest and the newest Python an owner's system may bring, since install.sh prefers a
  # system Python whose Tk draws with Xft (uv's own Python on Linux has a Tk without it).
  host-tests:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m unittest
        env:
          PYTHONIOENCODING: utf-8

  # Windows and macOS: the Python the start scripts install there (Install.cmd, Install.command).
  host-tests-windows-macos:
    needs: tree
    if: needs.tree.outputs.passed != 'true' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest
        env:
          PYTHONIOENCODING: utf-8

  lint:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check

  shell:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck
        run: python3 scripts/run-shellcheck.py

  repository:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Links in the documents
        run: python3 scripts/check-docs.py
      - name: Private data, in every commit
        run: python3 scripts/check-private.py --history

  # Each headset of the catalogue (overpressure/catalogue.py), its main dropped into devices/: this change
  # must not break it. Its own CI tests its changes against overpressure's main.
  headsets:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        headset: [phoenix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: overpressure/${{ matrix.headset }}
          path: devices/${{ matrix.headset }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - run: uv sync --locked
      - name: It loads
        run: |
          found=$(uv run python -m overpressure devices)
          echo "$found"
          ! grep -q refused <<< "$found"
      - name: Its tests
        run: uv run python -m unittest discover -t . -s devices/${{ matrix.headset }}/tests
        env:
          PYTHONIOENCODING: utf-8
      - name: Its types
        run: uv run ty check devices/${{ matrix.headset }}

  # The marker that this tree passed, for the runs after this one.
  passed:
    needs: [tree, host-tests, host-tests-windows-macos, lint, shell, repository, headsets]
    if: ${{ !cancelled() && !failure() && needs.tree.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.sha }}" > passed.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.tree.outputs.marker }}
          path: passed.txt
          retention-days: 90
