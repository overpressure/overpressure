# A release from its tag (docs/releasing.md): a pushed tag YYYY.M.PATCH[bN] runs every CI check on the
# tagged commit (skipped when its tree passed on main already, except the headsets', whose own main and
# releases move), then makes the GitHub release: the tag's subject as its title, the tag's own words and the
# changelog since the release before as its notes, the source zip the start scripts install from, and its
# checksum. No image, package or vendor file is attached: each headset is its own repository with its own
# releases (overpressure/catalogue.py).
name: Release
on:
  push:
    tags: ["20[0-9][0-9].*"] # calendar versions (docs/releasing.md); the v1.0-beta.N releases were before them

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/ci.yml
    with:
      fresh: true
    permissions:
      contents: read
      actions: read # an earlier pass of the same tree

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # the notes name each change's pull request and its author
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The checkout's tag is a lightweight copy; the annotated tag carries the release's own words.
      - name: The tag itself
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4" # the start scripts' (install.sh, Install.cmd)
      - name: The tag names pyproject.toml's version
        id: version
        run: |
          kind=$(python3 scripts/release.py check "$GITHUB_REF_NAME")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "name=overpressure-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Annotated, on main
        run: |
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || { echo "::error::$GITHUB_REF_NAME is not annotated: git tag -a"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Notes and changelog
        id: notes
        env:
          GH_TOKEN: ${{ github.token }} # the contributors: each commit's pull request and its author
        run: |
          title=$(python3 scripts/release.py notes "$GITHUB_REF_NAME" --title overpressure)
          echo "title=$title" >> "$GITHUB_OUTPUT"
          cat notes.md
      # The tag's own words are published as they are: nothing private in them (the history scan reads commits).
      - name: Nothing private in the notes
        run: |
          mkdir -p published && cp notes.md CHANGELOG.md published/
          python3 scripts/check-private.py --files published/notes.md published/CHANGELOG.md
      - name: The source zip
        run: |
          name=${{ steps.version.outputs.name }}
          git archive --format=zip --prefix="$name/" --add-file=CHANGELOG.md -o "$name.zip" "$GITHUB_REF_NAME"
          sha256sum "$name.zip" > "$name.zip.sha256"
          unzip -l "$name.zip" | tail -1
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          name=${{ steps.version.outputs.name }}
          flag=""
          [ "${{ steps.version.outputs.kind }}" = prerelease ] && flag=--prerelease
          gh release create "$GITHUB_REF_NAME" $flag --verify-tag \
            --title "$TITLE" --notes-file notes.md \
            "$name.zip" "$name.zip.sha256"

  # The app for each system with its bundled engine (docs/releasing.md#the-app), its update file signed with the
  # updater's key (the secret TAURI_SIGNING_PRIVATE_KEY, whose public half is tauri.conf.json's plugins.updater.pubkey). After the
  # release, so a failed build leaves it published: a system whose build failed is left out of the manifest, and a
  # release without the manifest offers the app no update. Without the key nothing is built.
  app:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, system: windows-x86_64, bundles: nsis }
          - { os: macos-latest, system: darwin-aarch64, bundles: app }
          - { os: ubuntu-22.04, system: linux-x86_64, bundles: appimage }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: The updater's key
        id: key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY: the release carries no app"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: steps.key.outputs.present == 'true'
        with:
          version: "0.13.4" # the start scripts' (install.sh, Install.cmd)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.key.outputs.present == 'true'
        with:
          version: "10.27.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"
      - name: The web view's libraries
        if: steps.key.outputs.present == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: The app, signed
        if: steps.key.outputs.present == 'true'
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          version=$(uv run --no-project --python 3.12 python ../scripts/app-manifest.py version)
          echo "{\"version\": \"$version\"}" > src-tauri/tauri.version.json
          pnpm bundle --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.json --config src-tauri/tauri.version.json
      - name: Its update file
        if: steps.key.outputs.present == 'true'
        run: uv run --no-project --python 3.12 python scripts/app-manifest.py collect --system "${{ matrix.system }}" --out app-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: app-${{ matrix.system }}
          path: app-files/
          if-no-files-found: error

  # The updater's manifest (overpressure-app.json) and each system's update file, attached to the release.
  app-release:
    needs: [release, app]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: app-files
          merge-multiple: true
      - name: The manifest and the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A app-files 2>/dev/null)" ]; then echo "::warning::no app was built"; exit 0; fi
          python3 scripts/app-manifest.py write --tag "$GITHUB_REF_NAME" app-files
          gh release upload "$GITHUB_REF_NAME" app-files/*

  # The fixes the release brings: every issue whose Stage is Awaiting release gets the release's link and is
  # closed (CLAUDE.md's Backlog). After the release, so a failure here leaves it published.
  issues:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Close the issues it releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py close "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
