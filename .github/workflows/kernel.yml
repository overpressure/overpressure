# SPDX-License-Identifier: Unlicense
# The pinned kernel (devices/phoenix/kernel/release.json) rebuilt from its commit in the build image the
# release was built with, and every file compared with the pin: the release the installer downloads is
# the source's. When the pin or the build changes, weekly, and on demand.
name: Kernel
on:
  push:
    paths:
      - "devices/*/kernel/release.json"
      - "devices/*/kernel/build-tree.sh"
      - "devices/*/scripts/build-kernel-step.sh"
      - "devices/*/tooling/kernel.py"
      - ".github/workflows/kernel.yml"
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phoenix:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - run: uv sync --locked
      - name: The release's files, downloaded and checked
        run: uv run python -m overpressure --device phoenix kernel fetch
      - name: The pinned commit, built here and checked against the release
        run: |
          mv out/kernel out/kernel-release
          uv run python -m overpressure --device phoenix kernel build
          cmp out/kernel/Image.gz out/kernel-release/Image.gz
          cat out/kernel/build.json
