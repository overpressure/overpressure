# Weekly: would the image still build on Valve's newest packages (docs/development.md#upgrade-check)? Valve's kernel
# is followed in overpressure/linux.
# The run fails when a build fails; its summary lists what Valve moved. It needs no vendor file and no headset:
# whether the session still runs on the result is checked on the headset before a release.
name: Upgrade check
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - run: uv sync --locked
      - name: The build container
        run: uv run python -m overpressure container pull
      - name: The check
        run: >-
          uv run python -m overpressure container run --
          bash devices/phoenix/scripts/upgrade-check.sh /var/tmp/pico4-upgrade-check out/upgrade-check
      - name: Summary
        if: always()
        run: cat out/upgrade-check/upgrade-check.md >> "$GITHUB_STEP_SUMMARY" || true
