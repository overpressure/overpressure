name: Bug report
description: The installer, the window, the command line or the build tooling does not work as documented (a headset's own system goes to its repository).
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Installer (window or command line)
        - Downloading a headset or its update
        - Builds and host tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Worn or on the table, cable in or out, which game or command.
  - type: input
    id: version
    attributes:
      label: Version
      description: overpressure's version or commit, and the headset's release (`python -m overpressure headset list`).
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Computer
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, ...
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: >-
        Attach the archive from `python -m overpressure dev support-bundle`. Identifiers are masked; it is plain text,
        so read it before attaching it. If the headset cannot be reached, say so.
    validations:
      required: true
