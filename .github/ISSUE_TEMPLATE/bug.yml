name: Bug report
description: Something on the headset, in the installer or in the tools does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Installer (window or command line)
        - Installed system on the headset
        - Games, Steam or SteamVR
        - Tracking or controllers
        - Builds and host tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Worn or on the table, cable in or out, which game or command.
  - type: input
    id: version
    attributes:
      label: Version
      description: The installer's version, or `cat /usr/share/pico4/version` on the headset, or the commit you built.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Computer
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, ...
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: >-
        Attach the archive from `python -m overpressure dev support-bundle`. Identifiers are masked; it is plain text,
        so read it before attaching it. If the headset cannot be reached, say so.
    validations:
      required: true
