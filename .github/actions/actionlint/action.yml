# The workflows of a repository checked by actionlint, pinned by its release's SHA-256: one pin for every
# repository of the organisation.
name: actionlint
description: actionlint, pinned by its release's SHA-256, on a repository's workflows
inputs:
  working-directory:
    description: The repository's checkout
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: actionlint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: 1.7.12
        SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        archive="$RUNNER_TEMP/actionlint.tar.gz"
        release="https://github.com/rhysd/actionlint/releases/download/v$VERSION"
        curl -fsSL -o "$archive" "$release/actionlint_${VERSION}_linux_amd64.tar.gz"
        echo "$SHA256  $archive" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -color
