# busybox mdev rules for the PICO 4 Linux POC (no devtmpfs on the stock kernel)
null        0:0 666
zero        0:0 666
full        0:0 666
random      0:0 666
urandom     0:0 666
tty         0:5 666
ptmx        0:5 666
kmsg        0:0 644
pmsg0       0:0 222

# Every disk/partition: read-only + /dev/block/by-name/<PARTNAME> links.
SUBSYSTEM=block;.*  0:6 660 */usr/libexec/pico4-poc/block-hotplug

# Everything else keeps the kernel's name (DEVNAME, e.g. dri/card0,
# input/event0, snd/pcmC0D0p) with root-only access.
.*          0:0 660
