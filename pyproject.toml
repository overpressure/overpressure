[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "overpressure"
version = "1.0b1"
license = {text = "Unlicense"}
description = "Linux and a SteamOS-compatible userspace on standalone VR headsets: image, device and test tooling"
readme = "README.md"
requires-python = ">=3.9"
# The tooling uses the standard library, plus pinned packages where they save the owner an outside
# tool: brotli decompresses the stock OTA's images (else the brotli command), pyusb with
# libusb-package's libusb counts EDL devices on every system (else PowerShell, ioreg or sysfs) and on
# Windows initializes the USB network link through UsbDk (overpressure/windows_ncm.py). Each
# use imports lazily: plain `python -m overpressure` runs without them (Tk and the gui extra for the window).
dependencies = ["brotli==1.2.1", "pyusb==1.3.1", "libusb-package==1.0.30.0"]

[project.optional-dependencies]
# The window (overpressure/window/); the start scripts install it, nothing else needs it.
gui = ["customtkinter==6.0.0"]

[project.scripts]
overpressure = "overpressure.__main__:main"

[project.gui-scripts]
overpressure-gui = "overpressure.__main__:gui"

# The tool runs from the repository (pip install -e .): .env, out/ and cache/ are there.
[tool.setuptools.packages.find]
include = ["overpressure", "overpressure.*", "devices", "devices.*"]
exclude = ["devices.*.tests"]

[tool.setuptools.package-data]
"devices.phoenix.tooling" = ["firmware.json"]

# Development: uv, ruff and ty (docs/development.md in the repository root's docs).
[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.98",
    # Only so that ty knows the window's imports (overpressure/window/): the same pin as the gui extra.
    "customtkinter==6.0.0",
]

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
line-length = 120
target-version = "py39"
# The headset's Python programs have no suffix; tests/test_repo_checks.py keeps this list complete.
extend-include = [
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-audiocal",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-fan",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-imu",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-lens",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-listeners",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-station",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-still-gate",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-support-bundle",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-suspend-check",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/battery-guard",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/bt-address",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/micmute",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/msm-frame-stats",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/powerkey",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/session-performance",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/steam-proton-mapping",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/steamvr-settings",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/usb-internet",
]

[tool.ruff.lint]
# Every rule. What is off below conflicts with another rule, with the formatter or with how the
# project is built, and says so; everything else is fixed, or carries a noqa with its reason.
select = ["ALL"]
ignore = [
    # Incompatible with D211 and D212, which ruff keeps: no blank line before a class docstring,
    # and a multi-line docstring's summary on its first line.
    "D203",
    "D213",
    # The formatter places trailing commas (ruff's documented conflict).
    "COM812",
    # pytest's style: the tests are unittest (standard library only), whose assertion methods
    # report what differed; a bare assert does not, and S101 forbids it.
    "PT009",
    "PT027",
    # One with statement for several contexts needs parentheses from Python 3.10 on to wrap.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Tests: their names say what they check, as docstrings would; they return nothing; their expected
# values are literals by nature, and ty's narrowing uses assert.
"{tests,devices/*/tests}/**" = ["D101", "D102", "D105", "D107", "ANN201", "ANN204", "PLR2004", "S101"]
# Everything but the tests is part of a command-line program: print is its output.
"{overpressure,devices/*/tooling,devices/*/kernel,devices/*/scripts,devices/*/userspace,scripts}/**" = ["T201"]

[tool.ruff.lint.flake8-copyright]
# The project's files name their license by SPDX identifier; the Unlicense has no copyright holder.
notice-rgx = "SPDX-License-Identifier: "

[tool.ruff.lint.isort]
known-first-party = ["overpressure", "devices"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.environment]
python-version = "3.9"
# The tooling runs on Windows, Linux and macOS, the headset's programs on Linux: check every branch.
python-platform = "all"
# panel_sequence.py imports its neighbour dtbo_sink.py as a script does.
extra-paths = ["devices/phoenix/kernel"]

[tool.ty.src]
# The Python files, and the headset's Python programs without a suffix (as in [tool.ruff]).
include = [
    "overpressure",
    "devices",
    "scripts",
    "tests",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-audiocal",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-fan",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-imu",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-lens",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-listeners",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-station",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-still-gate",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-support-bundle",
    "devices/phoenix/userspace/rootfs/usr/bin/pico4-suspend-check",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/battery-guard",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/bt-address",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/micmute",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/msm-frame-stats",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/powerkey",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/session-performance",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/steam-proton-mapping",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/steamvr-settings",
    "devices/phoenix/userspace/rootfs/usr/libexec/pico4/usb-internet",
]
