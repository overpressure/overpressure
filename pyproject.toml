[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "overpressure"
version = "0.7.0"
description = "Linux and a SteamOS-compatible userspace on standalone VR headsets: image, device and test tooling"
readme = "README.md"
requires-python = ">=3.9"
# The tooling itself uses the standard library only (Tk for the window).
dependencies = []

[project.optional-dependencies]
# Windows hosts: initializes a stock kernel's NCM gadget through UsbDk (overpressure/windows_ncm.py).
windows-ncm = ["pyusb==1.3.1", "libusb-package==1.0.30.0"]

[project.scripts]
overpressure = "overpressure.__main__:main"

[project.gui-scripts]
overpressure-gui = "overpressure.__main__:gui"

# The tool runs from the repository (pip install -e .): .env, out/ and cache/ are there.
[tool.setuptools.packages.find]
include = ["overpressure", "devices", "devices.*"]
exclude = ["devices.*.tests"]

[tool.setuptools.package-data]
"devices.phoenix.tooling" = ["firmware.json"]
