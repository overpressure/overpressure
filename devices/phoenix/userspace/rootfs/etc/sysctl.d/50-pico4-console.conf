# Keep informational kernel messages off the UART console. The camera driver
# logs every start of frame at KERN_INFO; printed on the serial console each
# line costs ~13 ms in interrupt context and the tracking cameras stall.
# Level 5 still shows warnings and the default-level (4) lines that the
# project's scripts write to /dev/kmsg, which the QEMU harness reads.
kernel.printk = 5 4 1 7
