# Monado (the OpenXR compositor) needs real-time threads. The stock kernel has
# CONFIG_RT_GROUP_SCHED, and with cgroup v2 that refuses SCHED_FIFO/RR in any
# cgroup where the cpu controller is enabled. No CPU accounting by default, and
# see user/*.slice.d for the slices that would enable the controller anyway.
[Manager]
DefaultCPUAccounting=no
