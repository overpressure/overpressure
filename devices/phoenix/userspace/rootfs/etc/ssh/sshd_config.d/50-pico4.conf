# Keys only, on the USB link and on Wi-Fi: the keys "dev image" enrolled at install, which stage 1
# copies to /root/.ssh/authorized_keys at every boot. No password ever logs in (docs/security.md).
# The host key is the stage-1 dropbear key, converted during the handoff, so the runner's pinned
# known_hosts entry stays valid.
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
X11Forwarding no
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
