# Same access policy as the stage-1 POC shell: root over the USB cable,
# per-run keys from the hardware runner, or the empty password interactively.
# The host key is the stage-1 dropbear key, converted during the handoff, so
# the runner's pinned known_hosts entry stays valid.
PermitRootLogin yes
PermitEmptyPasswords yes
PasswordAuthentication yes
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
