# NetworkManager's Wi-Fi stays on wpa_supplicant (docs/userspace.md#wi-fi). The Steam client sets
# the Frame's iwd backend through steamos-manager, which writes 99-valve-wifi-backend.conf here;
# iwd is not installed and cannot run on the stock kernel (no AF_ALG crypto sockets,
# CONFIG_CRYPTO_USER_API_*), and with it wlan0 stays "unavailable". This file sorts after
# Valve's, and the last value wins.
[device]
wifi.backend=wpa_supplicant
