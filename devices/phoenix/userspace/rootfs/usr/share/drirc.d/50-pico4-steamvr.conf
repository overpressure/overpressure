<?xml version="1.0" standalone="yes"?>
<!--
Turnip settings for SteamVR on the PICO 4 (pico4-turnip-kgsl's wsi-compressed-scanout.patch).

SteamVR's compositor asks for storage usage on its swapchain images and never uses it. The A650
cannot compress storage images, so the display would scan out uncompressed images, which costs
the compositor about 2 ms per frame; without that usage it resolves straight into compressed
scanout images.
-->
<driconf>
    <device driver="turnip">
        <application name="SteamVR compositor" executable="vrcompositor">
            <option name="vk_wsi_ignore_storage_usage" value="true" />
        </application>
    </device>
</driconf>
