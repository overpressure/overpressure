# The PICO 4's sound card (kona-mtp-snd-card: two WSA881x speakers, analog microphones on the
# WCD938x), docs/userspace.md#audio. Routes and defaults are PICO OS's (mixer_paths.xml).
Syntax 4

SectionUseCase."HiFi" {
	File "/conf.d/kona-mtp-snd-ca/HiFi.conf"
	Comment "Speakers and microphone"
}

# PICO OS's defaults for the controls the routes use.
BootSequence [
	cset "name='WSA_RX0 Digital Volume' 84"
	cset "name='WSA_RX1 Digital Volume' 84"
	cset "name='TX_DEC0 Volume' 84"
	cset "name='ADC1 Volume' 12"
]
