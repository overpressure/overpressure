# NetworkManager's Wi-Fi on the stock kernel stays on wpa_supplicant (docs/userspace.md#wi-fi). The
# Steam client sets the Frame's iwd backend through steamos-manager, which writes
# 99-valve-wifi-backend.conf in /etc; iwd cannot run on the stock kernel (no AF_ALG crypto
# sockets, CONFIG_CRYPTO_USER_API_*), and with it wlan0 stays "unavailable".
# pico4-wifi-backend.service links this file into /run/NetworkManager/conf.d on the stock kernel
# only, where it sorts after Valve's and the last value wins; a mainline kernel runs iwd.
[device]
wifi.backend=wpa_supplicant
