# The Frame's codec links (/dev/video-dec0, /dev/video-enc0) through the PICO 4's vrdevice_path,
# which opens the codec's nodes: on the stock kernel only after Venus's restart level is RELATED
# (opening them boots Venus), on a mainline kernel once the codec is probed with its firmware
# (docs/session.md#steam-link). Each unit skips itself on the other kernel.
[Unit]
ConditionPathExists=/usr/lib/firmware/venus.mdt
Requires=pico4-venus.service
Wants=pico4-venus-probe.service
After=pico4-venus.service pico4-venus-probe.service
