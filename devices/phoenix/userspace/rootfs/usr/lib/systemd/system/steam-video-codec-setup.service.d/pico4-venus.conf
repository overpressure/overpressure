# The Frame's codec links (/dev/video-dec0, /dev/video-enc0) through the PICO 4's vrdevice_path,
# which opens the codec's nodes and so boots Venus: only with its firmware and only after its
# restart level is RELATED (docs/session.md#steam-link).
[Unit]
ConditionPathExists=/usr/lib/firmware/venus.mdt
Requires=pico4-venus.service
After=pico4-venus.service
