# SteamVR on the PICO 4 (docs/session.md). Its compositor finds the panels through
# the pico4-vrdisplay Vulkan layer (the KGSL GPU has no display of its own);
# driver_monado (Monado's SteamVR plugin) provides the headset and controllers;
# its recommended render size is the panel's (100%), not Monado's default 140%.
# SteamVR waits for each present to be shown before it starts the next frame; with one
# frame ahead the layer (on Valve's kernel pico4-swapchain-usage, which also gives it the images
# for it) counts a present as shown once the one before it is, so the GPU renders while SteamVR waits. SteamVR starts its frames about 4 ms before the
# vblank it sees; the layer signals vblanks 5 ms early (with 4 ms the Frame's Facet
# renderer stalls for a second now and then). The layer publishes the lead it applies and
# the driver predicts that much further to match (docs/session.md, performance).
[Service]
# The image's SteamVR settings into the user's file, which lives on the data partition and is
# copied from the image only on an install's first boot (docs/session.md).
ExecStartPre=/usr/libexec/pico4-poc/steamvr-settings
Environment=XRT_COMPOSITOR_SCALE_PERCENTAGE=100
Environment=PICO4_VRDISPLAY=1
Environment=PICO4_VRDISPLAY_FRAMES_AHEAD=1
Environment=PICO4_VRDISPLAY_VSYNC_LEAD_US=5000
# Compressed (UBWC) scanout (the stock kernel's layer): the compositor renders straight into the compressed images
# the panels read, which halves its lens-distortion pass and frees memory bandwidth
# (docs/session.md, performance).
Environment=PICO4_VRDISPLAY_UBWC=2
# A memory barrier before each render pass: without it chunks of the overlay are missing in
# the right eye (docs/graphics.md).
Environment=PICO4_VRDISPLAY_PASS_BARRIER=1
# The display layer raises the GPU floor while presenting; a crashed compositor cannot
# restore it, so every stop puts back KGSL's default (min_pwrlevel is writable by video).
ExecStopPost=-/bin/sh -c 'cat /sys/class/kgsl/kgsl-3d0/default_pwrlevel > /sys/class/kgsl/kgsl-3d0/min_pwrlevel'
# When the session stops, vrserver is often gone before the stop runs: the shutdown request
# then finds no server and exits 255. That made every stop a failure: OnFailure= started the
# fallback, and Valve's health check counted it as a failed launch; after three in a row it
# resets the Steam installation (2.5 GB unpacked again, then updated). A failed shutdown
# request is not a failed SteamVR; a crash still fails through the main process.
ExecStop=
ExecStop=-/usr/share/deckard/select_steamvr.sh bin/linuxarm64/vrstartup -shutdown
Environment=PICO4_VRDISPLAY_LOGFILE=%h/.local/share/Steam/logs/pico4-vrdisplay.txt
