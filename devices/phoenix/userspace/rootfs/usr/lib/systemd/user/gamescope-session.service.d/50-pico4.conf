# gamescope on the PICO 4 (docs/session.md). It needs the GPU's DRM nodes
# (VK_EXT_physical_device_drm), which Turnip's KGSL backend lacks: the
# pico4-vrdisplay layer reports msm_drm's, whose render node imports the GPU's
# dma-bufs. With the OpenVR backend, input comes through SteamVR's overlays and
# gamescope's EIS socket; wlroots must not insist on libinput devices.
# OpenGL on the GPU is zink on Turnip: Mesa's loader would pick the msm driver
# for msm_drm's node, which has no GPU, and fall back to llvmpipe. Xwayland's
# glamor (and so DRI3 for X11 clients) needs it (docs/graphics.md). On a mainline
# kernel zink is the Frame's OpenGL (its Mesa has no other driver).
[Service]
Environment=PICO4_VRDISPLAY=1
Environment=WLR_LIBINPUT_NO_DEVICES=1
Environment=MESA_LOADER_DRIVER_OVERRIDE=zink
