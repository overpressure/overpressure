# The Steam client on the PICO 4 (docs/session.md): OpenGL on the GPU is zink on
# Turnip, for the client, its web helper's GPU process and the games it starts
# (docs/graphics.md). Zink finds the GPU for msm_drm's render node through the
# DRM nodes the pico4-vrdisplay layer reports (VK_EXT_physical_device_drm).
# The web helper composites on ANGLE's Vulkan backend (-cef-use-vulkan, which
# RUNSTEAM.sh appends from STEAM_EXTRA_ARGS): through ANGLE's OpenGL backend on
# zink, the client's VR overlays alternate between the new and an older frame
# while a dialog opens or closes.
# Games run in Steam Linux Runtime's container, whose /etc has no ld.so.preload:
# pressure-vessel carries the client's LD_PRELOAD into it (as /run/host/...), so
# the Steam API's semaphores in the game work there too (pico4-sysvsem).
[Service]
Environment=PICO4_VRDISPLAY=1
Environment=MESA_LOADER_DRIVER_OVERRIDE=zink
Environment=STEAM_EXTRA_ARGS=-cef-use-vulkan
Environment=LD_PRELOAD=/usr/lib/libpico4-sysvsem.so
