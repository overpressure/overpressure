# The PICO's USB gadget (NCM network + log drive) is set up by the stage-1 POC
# and must survive into stage 2. The Steam Frame's Type-C plug handler
# (/usr/share/deckard/typec-plug-event.sh) honours this flag and leaves the
# gadget alone; its gadget units are also masked by build-userspace.sh.
f /tmp/usb_gadget_block 0644 root root -
